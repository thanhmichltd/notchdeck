<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NotchDeck — Legal</title>
<style>
  :root{
    --bg:#f7f7f9; --card:#ffffff; --text:#1c1e21; --muted:#5b6069;
    --accent:#3757ff; --border:#e6e7eb;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#14151a; --card:#1c1e24; --text:#eceef2; --muted:#9aa0ab; --accent:#7c94ff; --border:#2a2c34; }
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  .wrap{max-width:520px; margin:0 auto; padding:64px 20px;}
  .card{background:var(--card); border:1px solid var(--border); border-radius:16px; padding:36px;}
  h1{font-size:1.4rem; margin:0 0 6px;}
  p.sub{color:var(--muted); margin:0 0 24px;}
  ul{list-style:none; margin:0; padding:0;}
  li{margin-bottom:12px;}
  a{display:block; padding:14px 16px; border:1px solid var(--border); border-radius:10px; color:var(--text); text-decoration:none;}
  a:hover{border-color:var(--accent); color:var(--accent);}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>NotchDeck</h1>
    <p class="sub">Legal &amp; policy pages</p>
    <ul>
      <li><a href="privacy/">Privacy Policy</a></li>
      <li><a href="terms/">Terms of Use</a></li>
      <li><a href="delete-account/">Data Deletion</a></li>
    </ul>
  </div>
</div>
</body>
</html>
